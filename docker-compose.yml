services:
  db:
    image: postgres:17-alpine
    container_name: tcc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcc
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc -d tcc"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
